<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prix de Verano 2026 - Ajedrez UNLP</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0221;
            --neon-pink: #ff0055;
            --neon-cyan: #00f2ff;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            text-transform: uppercase;
            text-align: center;
            font-size: 1.3rem;
            margin: 15px 0;
        }

        .stream-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
            margin-bottom: 20px;
            background: #000;
        }

        .stream-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: white;
            padding: 12px 10px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            border-radius: 5px;
            flex: 1;
            max-width: 180px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--neon-cyan);
            font-weight: bold;
        }

        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            width: 100%;
            margin-bottom: 30px;
        }

        .hidden {
            display: none;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            margin-top: 0;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            padding: 8px 4px;
            text-align: left;
            font-size: 0.75rem;
        }

        td {
            padding: 10px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-pos {
            width: 35px;
            text-align: center;
        }

        .col-user {
            width: auto;
        }

        .col-pts {
            width: 50px;
            text-align: center;
        }

        .text-pink {
            color: var(--neon-pink);
            font-weight: bold;
        }

        .text-cyan {
            color: var(--neon-cyan);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Prix de Verano UNLP</h1>

        <div class="stream-container">
            <iframe
                src="https://player.twitch.tv/?channel=clubajedrezinformatica&parent=clubajedrezinformatica.github.io"
                frameborder="0" allowfullscreen="true" scrolling="no">
            </iframe>
        </div>

        <div class="tabs">
            <button id="btn-gen" class="tab-btn active" onclick="showTab('general')">Tabla General</button>
            <button id="btn-fec" class="tab-btn" onclick="showTab('fecha')">Fecha 3 (En Vivo)</button>
        </div>

        <div id="tab-general" class="leaderboard-card">
            <h2 style="color: var(--neon-pink);">Ranking Acumulado</h2>
            <table>
                <thead>
                    <tr>
                        <th class="col-pos">#</th>
                        <th class="col-user">Jugador</th>
                        <th class="col-pts">Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-general-cuerpo"></tbody>
            </table>
        </div>

        <div id="tab-fecha" class="leaderboard-card hidden">
            <h2 style="color: var(--neon-cyan);">Resultados Fecha 3</h2>
            <table>
                <thead>
                    <tr>
                        <th class="col-pos">#</th>
                        <th class="col-user">Jugador</th>
                        <th class="col-pts">Pts</th>
                    </tr>
                </thead>
                <tbody id="tabla-fecha-cuerpo">
                    <tr>
                        <td colspan="3" style="text-align:center">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const PRIX_GENERAL = [
            { user: "LuchiniFrank", pts: 61}, { user: "Ajedrezfacu", pts: 60 }, { user: "mago_pol", pts: 54}, { user: "MiyuKoto", pts: 50}, { user: "MTJRFAN2", pts: 46 }, 
            { user: "grauclub", pts: 46}, { user: "Tomimartinez95", pts: 43 }, { user: "naty_la_25", pts: 42 }, { user: "poder-ozo", pts: 28 }, {user: "FuerzasArmadas", pts: 27}, 
            { user: "Polyamor", pts: 26 }, { user: "dfarchich", pts: 25 }, { user: "M3TR3STRO", pts: 24 }, { user: "jugador_79", pts: 22 }, { user: "ikeandas", pts: 21 }, 
            { user: "Tuviejateama", pts: 20 }, { user: "Santiluison_99", pts: 20 }, { user: "Floqui77", pts: 20}, { user: "Mecamdane", pts: 18 }, { user: "AgusDF", pts: 18 }, 
            { user: "santiromero1", pts: 18}, { user: "seacabolamentira2", pts:17}, { user: "memidepe", pts: 16 }, { user: "franky073", pts: 16 }, { user: "DLelouche", pts: 16 },
            { user: "lemniscata18", pts: 16 }, { user: "ominoso", pts: 14 }, { user: "La_Faustineta", pts: 13 },  { user: "alex2018inf", pts: 12 }, { user: "efarias", pts: 12}, 
            { user: "caramto15", pts: 10}, { user: "Gia_19", pts: 10}, { user: "gaston1977", pts: 9 }, { user: "misting", pts: 9 }, { user: "santilointenta", pts: 8 },
            { user: "brunoblanco", pts: 8 }, { user: "christianOpsi", pts: 8 }, { user: "Flexotanil", pts: 6 }, { user: "cristianhacker", pts: 6 }, { user: "cascarudopampero", pts: 6 }, 
            { user:"PaTriPErO", pts: 5}, { user: "Luchonet", pts: 4 }, { user: "ThiagoDTL", pts: 4 }, { user: "DaniLeonina00", pts: 4 }, { user: "Candecrig", pts: 2 }, 
            { user: "evaristom", pts: 2 }, { user: "luquettibahia", pts: 0 }, { user: "oterobarbi", pts: 0 }, { user: "nicootina", pts: 0 }, { user: "patovichm", pts: 0 }, 
            { user: "MarioBross2004", pts: 0 }, { user: "caretofobia666", pts: 0 }, { user: "Quique2876", pts: 0 }, { user: "SBTommy", pts: 0 }, { user: "Zorresco", pts: 0 }, 
            { user: "KETEMETO2", pts: 0 }, { user: "Mfjha", pts: 0 }, { user: "rodri_garcia", pts: 0 }, { user: "manucho18", pts: 0 }, {user: "dfarchich1", pts: 0}, 
            { user: "Caballodetroya2022", pts:0}, {user:"LEO_LaPlata", pts:0}
        ];

        const TOURNAMENT_ID = '1XaQzY29';

        function renderGeneral() {
            const tbody = document.getElementById('tabla-general-cuerpo');
            PRIX_GENERAL.sort((a, b) => b.pts - a.pts);
            tbody.innerHTML = PRIX_GENERAL.map((p, i) => `
                <tr>
                    <td class="col-pos text-pink">${i + 1}</td>
                    <td class="col-user" style="color:white; font-weight:bold;">${p.user}</td>
                    <td class="col-pts text-cyan">${p.pts}</td>
                </tr>
            `).join('');
        }

        async function fetchLichessData() {
            try {
                const response = await fetch(`https://lichess.org/api/tournament/${TOURNAMENT_ID}/results?nb=50`);
                if (!response.ok) return;
                const text = await response.text();
                const standings = text.trim().split('\n').filter(l => l).map(line => JSON.parse(line));
                const tbody = document.getElementById('tabla-fecha-cuerpo');

                if (standings.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center">Esperando inicio...</td></tr>`;
                    return;
                }

                tbody.innerHTML = standings.map((player, index) => `
                    <tr>
                        <td class="col-pos text-pink">${index + 1}</td>
                        <td class="col-user" style="color:white; font-weight:bold;">${player.username}</td>
                        <td class="col-pts text-cyan">${player.score || 0}</td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function showTab(tab) {
            const isGen = tab === 'general';
            document.getElementById('tab-general').classList.toggle('hidden', !isGen);
            document.getElementById('tab-fecha').classList.toggle('hidden', isGen);
            document.getElementById('btn-gen').classList.toggle('active', isGen);
            document.getElementById('btn-fec').classList.toggle('active', !isGen);
        }

        renderGeneral();
        fetchLichessData();
        setInterval(fetchLichessData, 30000);
    </script>
</body>

</html>
