<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prix de Verano 2026 - Ajedrez UNLP</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Estilos para los botones de las tablas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            border-radius: 5px;
        }

        .tab-btn.active {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .hidden {
            display: none;
        }
    </style>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('general')">Tabla General</button>
            <button class="tab-btn" onclick="showTab('fecha')">Fecha 2 (En Vivo)</button>
        </div>

        <div id="tab-general" class="leaderboard-card">
            <h2 style="color: var(--neon-pink);">Ranking Acumulado (Post Fecha 1)</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="col-pos">Pos</th>
                            <th class="col-user">Jugador</th>
                            <th class="col-pts">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-general-cuerpo">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-fecha" class="leaderboard-card hidden">
            <h2 style="color: var(--neon-cyan);">Resultados Fecha 2</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="col-pos">Pos</th>
                            <th class="col-user">Jugador</th>
                            <th class="col-pts">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-fecha-cuerpo">
                        <tr>
                            <td colspan="3" style="text-align:center">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

        // 2. CONFIGURACIÓN DEL TORNEO ACTUAL
        const TOURNAMENT_ID = 'FUpVKGt3';

        function renderGeneral() {
            const tbody = document.getElementById('tabla-general-cuerpo');
            // Ordenar por puntos por si te equivocás al tipear
            PRIX_GENERAL.sort((a, b) => b.pts - a.pts);

            tbody.innerHTML = PRIX_GENERAL.map((p, i) => `
                <tr>
                    <td class="col-pos text-pink">${i + 1}</td>
                    <td class="col-user" style="color:white">${p.user}</td>
                    <td class="col-pts text-cyan">${p.pts}</td>
                </tr>
            `).join('');
        }

        async function fetchLichessData() {
            try {
                const response = await fetch(`https://lichess.org/api/tournament/${TOURNAMENT_ID}/results?nb=50`);
                const text = await response.text();
                const standings = text.trim().split('\n').map(line => JSON.parse(line));
                const tbody = document.getElementById('tabla-fecha-cuerpo');

                if (standings.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center">Torneo no iniciado</td></tr>`;
                    return;
                }

                tbody.innerHTML = standings.map((player, index) => `
                    <tr>
                        <td class="col-pos text-pink">${index + 1}</td>
                        <td class="col-user" style="color:white">${player.username}</td>
                        <td class="col-pts text-cyan">${player.score || 0}</td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        // Lógica de Tabs
        function showTab(tab) {
            document.getElementById('tab-general').classList.toggle('hidden', tab !== 'general');
            document.getElementById('tab-fecha').classList.toggle('hidden', tab !== 'fecha');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', (btn.innerText.toLowerCase().includes(tab)));
            });
        }

        // Inicializar
        renderGeneral();
        fetchLichessData();
        setInterval(fetchLichessData, 30000);
    </script>
    </body>
