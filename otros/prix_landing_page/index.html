<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prix de Verano 2026 - Ajedrez UNLP</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0221;
            --neon-pink: #ff0055;
            --neon-cyan: #00f2ff;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            /* Evita scroll lateral molesto */
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            text-transform: uppercase;
            text-align: center;
            font-size: 1.5rem;
            margin: 20px 0;
        }

        /* Stream Responsivo */
        .stream-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
            margin-bottom: 20px;
            background: #000;
        }

        .stream-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Tabla Blindada */
        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            width: 100%;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            font-size: 1.1rem;
            margin-top: 0;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: hidden;
            /* No permitimos scroll, forzamos ajuste */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            /* OBLIGA a respetar anchos */
        }

        th {
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            padding: 10px 5px;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            /* Corta nombres largos con ... */
        }

        /* Anchos fijos de columnas */
        .col-pos {
            width: 45px;
            text-align: center;
        }

        .col-user {
            width: auto;
        }

        /* El resto para el nombre */
        .col-elo {
            width: 65px;
            text-align: center;
        }

        .col-pts {
            width: 60px;
            text-align: center;
        }

        .text-cyan {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .text-pink {
            color: var(--neon-pink);
            font-weight: bold;
        }

        .text-yellow {
            color: #ffcc00;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Prix de Verano UNLP</h1>

        <div class="stream-container">
            <iframe
                src="https://player.twitch.tv/?channel=clubajedrezinformatica&parent=clubajedrezinformatica.github.io"
                frameborder="0" allowfullscreen="true" scrolling="no">
            </iframe>
        </div>

        <div class="leaderboard-card">
            <h2>Posiciones en Vivo</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="col-pos">Pos</th>
                            <th class="col-user">Jugador</th>
                            <th class="col-elo">Elo</th>
                            <th class="col-pts">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                        <tr>
                            <td colspan="4" style="text-align:center">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const TOURNAMENT_ID = 'JL4yzCGi';

        async function fetchLichessData() {
            try {
                const response = await fetch(`https://lichess.org/api/tournament/${TOURNAMENT_ID}/results?nb=100`);
                if (!response.ok) throw new Error('Error en red');
                const text = await response.text();
                const standings = text.trim().split('\n').map(line => JSON.parse(line));
                const tbody = document.getElementById('tabla-cuerpo');

                if (standings.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center">Esperando inscriptos...</td></tr>`;
                    return;
                }

                tbody.innerHTML = standings.map((player, index) => `
                    <tr>
                        <td class="col-pos text-pink">${index + 1}</td>
                        <td class="col-user" style="color: white; font-weight: 500;">${player.username}</td>
                        <td class="col-elo text-yellow">${player.rating || '-'}</td>
                        <td class="col-pts text-cyan">${player.score || 0}</td>
                    </tr>
                `).join('');

            } catch (error) {
                document.getElementById('tabla-cuerpo').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red">Error al cargar datos</td></tr>`;
            }
        }

        fetchLichessData();
        setInterval(fetchLichessData, 30000);
    </script>
</body>

</html>
